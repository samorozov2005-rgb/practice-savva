name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA of an image already published in GHCR
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck test jacocoTestReport jacocoTestCoverageVerification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          if-no-files-found: error
          path: |
            build/reports/tests/
            build/reports/jacoco/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: echo "image=ghcr.io/${OWNER,,}/support-ticket-service:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, linux, student-stand]
    environment: student-stand
    concurrency: student-stand
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      COMPOSE_PROJECT_NAME: practice-savva
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate persistent stand configuration
        run: |
          if [[ -z "${DEPLOY_DIR:-}" || ! -f "$DEPLOY_DIR/.env" ]]; then
            echo "Repository variable DEPLOY_DIR must point to a persistent directory containing .env" >&2
            exit 2
          fi
      - name: Deploy verified image
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          ./scripts/deploy.sh "$DEPLOY_IMAGE"

  deploy-specific-image:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, linux, student-stand]
    environment: student-stand
    concurrency: student-stand
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      COMPOSE_PROJECT_NAME: practice-savva
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate persistent stand configuration
        run: |
          if [[ -z "${DEPLOY_DIR:-}" || ! -f "$DEPLOY_DIR/.env" ]]; then
            echo "Repository variable DEPLOY_DIR must point to a persistent directory containing .env" >&2
            exit 2
          fi
      - id: image
        name: Validate SHA and form GHCR image reference
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must contain exactly 40 hexadecimal characters" >&2
            exit 2
          fi
          owner_lower="${OWNER,,}"
          echo "reference=ghcr.io/$owner_lower/support-ticket-service:${COMMIT_SHA,,}" >> "$GITHUB_OUTPUT"
      - name: Deploy selected existing image
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          ./scripts/deploy.sh "$DEPLOY_IMAGE"
