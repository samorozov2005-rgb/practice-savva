spring:
  application:
    name: support-ticket-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/support}
    username: ${DB_USER:support}
    password: ${DB_PASSWORD:support_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true
